<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Data Downloader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f9f9f9;
    }

    h2 {
      margin-bottom: 30px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #218838;
    }
  </style>
</head>
<body>

  <h2>Download API Data as data.js</h2>
  <button id="downloadBtn">Download data.js</button>

  <script>
    const downloadBtn = document.getElementById("downloadBtn");

    function unicodeSafeStringify(obj) {
      return JSON.stringify(obj, null, 2)
        .replace(/\\u([\dA-F]{4})/gi, 
          (_, grp) => String.fromCharCode(parseInt(grp, 16))
        );
    }

    downloadBtn.addEventListener("click", async () => {
      try {
        // API fetch
        const response = await fetch("https://movieb-f42x.onrender.com/api/movies");
        const data = await response.json();

        // Reverse data so newest is on top
        const reversedData = data.reverse();

        // Convert API data to desired format
        const videos = reversedData.map(item => ({
          title: item.hadding,
          imageLink: item.img,
          fileName: `${item.id}.html`
        }));

        // Create JS file content with proper Unicode
        const fileContent = `const videos = ${unicodeSafeStringify(videos)};`;

        // Create blob
        const blob = new Blob([fileContent], { type: "application/javascript;charset=utf-8" });

        // Create download link
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "data.js";

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

      } catch (error) {
        console.error("Error fetching data:", error);
        alert("Failed to fetch API data!");
      }
    });
  </script>

</body>
</html>
